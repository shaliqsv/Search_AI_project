[project]
name = "ranking"
version = "0.1.0"
description = "Search and ranking on the OTTO dataset"
readme = "README.md"
authors = [
    { name = "shaliqsv", email = "shaliqv25@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
