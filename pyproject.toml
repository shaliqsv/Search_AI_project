[project]
name = "ranking"
version = "0.1.0"
description = "Search and ranking on the OTTO dataset"
readme = "README.md"
authors = [
    { name = "shaliqsv", email = "shaliqv25@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7.0",
    "catboost>=1.2.10",
    "faiss-cpu>=1.15.1",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "optuna>=5.0.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "rank-bm25>=0.2.2",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-include = ["*.ipynb"]  # lint notebooks too
